host: marketflowapi.codevertexafrica.com
info:
  contact: {}
  description: AI-powered marketing automation platform API. Manages leads, contacts,
    campaigns, funnels, knowledge base, and AI chat sessions for FLP FBOs and generic
    businesses.
  title: MarketFlow API
  version: 1.0.0
paths:
  /{tenantID}/campaigns/{campaignID}/send-sms:
    post:
      consumes:
      - application/json
      description: Hands the send to notifications-api's broadcast engine (consent,
        opt-outs, pacing); it waits for approval in Broadcasts.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenantID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: campaignID
        required: true
        type: string
      - description: Bulk SMS request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaigns.sendSMSRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Send a bulk SMS for a campaign
      tags:
      - Campaigns
  /accounts:
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Filter by industry
        in: query
        name: industry
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List accounts
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/accounts.createAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Create an account (company)
      tags:
      - Accounts
  /accounts/{id}:
    delete:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Delete an account
      tags:
      - Accounts
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Account UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Get an account by ID
      tags:
      - Accounts
    put:
      consumes:
      - application/json
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
