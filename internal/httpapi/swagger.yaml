        in: query
        name: industry
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List accounts
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/accounts.createAccountRequest'
      produces:
