      language:
        description: en or sw; default the brief's
        type: string
      music_licensed:
        type: boolean
      music_url:
        description: |-
          MusicURL is an optional music bed under the voice. MusicLicensed is the owner's
          confirmation that the track may be used in ads; a link without it is refused.
        type: string
      photo_urls:
        description: 'default: the offering''s photos'
        items:
          type: string
        type: array
      price:
        type: string
      script:
        allOf:
        - $ref: '#/definitions/creative.VideoScript'
        description: |-
          Script is a script already written and reviewed by the Marketing Manager's team (a
          WhatsApp or chat request, os_turn.go). When set, it is validated like an owner's edit
          and the version starts at script_ready: no script job and no second script charge.
      seconds:
        description: 15 to 60, default 30
        type: integer
      subline:
        type: string
      tier:
        description: standard (default) or premium
        type: string
      voice:
        description: a voice id or name; "" picks the best for the delivery
        type: string
      voice_accent:
        description: e.g. african, kenyan, nigerian
        type: string
      voice_gender:
        type: string
    type: object
