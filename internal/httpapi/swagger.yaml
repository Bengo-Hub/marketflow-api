host: marketflowapi.codevertexitsolutions.com
info:
  contact: {}
  description: AI-powered marketing automation platform API. Manages leads, contacts,
    campaigns, funnels, knowledge base, and AI chat sessions for FLP FBOs and generic
    businesses.
  title: MarketFlow API
  version: 1.0.0
paths:
  /admin/audit:
    get:
      parameters:
      - description: Filter by event name
        in: query
        name: event
        type: string
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List platform audit events
      tags:
      - Admin - Audit
  /admin/providers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List platform providers
      tags:
      - Admin - Providers
  /admin/providers/{id}:
    delete:
      parameters:
      - description: Provider setting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Deactivate a provider
      tags:
      - Admin - Providers
  /admin/providers/configure:
    post:
      consumes:
      - application/json
      description: Upserts provider settings with optional encryption for secrets.
        Platform owners only.
      parameters:
      - description: Provider configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin.configureProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Configure a platform provider
      tags:
      - Admin - Providers
  /admin/providers/resolve:
    get:
      description: Returns decrypted secret values. Requires platform X-API-Key; platform_owner
        JWT also accepted. Not for UI display.
      parameters:
      - description: Provider type (ai_llm, ai_search, meta_ads, google_calendar,
          etc.)
        in: query
        name: type
        required: true
        type: string
      - description: Provider name (groq, tavily, meta, oauth, ...)
        in: query
        name: name
        required: true
        type: string
      - description: 'Environment (default: production)'
        in: query
        name: env
        type: string
      - description: Tenant UUID for tenant-scoped lookup; omit for platform lookup
        in: query
        name: tenant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - apiKey: []
      summary: Resolve platform provider settings (decrypted, service-only)
      tags:
      - Admin - Providers
  /admin/providers/settings:
    get:
      parameters:
      - description: Provider type (ai_llm, meta_ads, etc.)
        in: query
        name: type
        required: true
        type: string
      - description: Provider name (groq, ollama, meta, etc.)
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Get platform provider settings
      tags:
      - Admin - Providers
  /admin/usage:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Platform-wide usage rollup
      tags:
      - Admin - Analytics
  /analytics/audit:
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Filter by event name
        in: query
        name: event
        type: string
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List tenant audit events
      tags:
      - Analytics - Audit
  /analytics/dashboard:
    get:
      description: Counts + week-over-week deltas for leads, contacts, chat sessions,
        campaigns, meetings, active nurture enrollments.
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Tenant dashboard aggregates
      tags:
      - Analytics
  /campaigns:
    get:
      description: Returns paginated campaigns with optional filters
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: 'Filter by status: draft, active, paused, completed, failed'
        in: query
        name: status
        type: string
      - description: 'Filter by type: lead_gen, retargeting, recruitment, re_engagement'
        in: query
        name: campaign_type
        type: string
      - description: 'Filter by platform: meta, manual, google'
        in: query
        name: platform
        type: string
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List campaigns
      tags:
      - Campaigns
    post:
      consumes:
      - application/json
      description: Creates a marketing campaign (Meta, Google, or manual)
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_campaigns.createCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Create a new campaign
      tags:
      - Campaigns
  /campaigns/{id}:
    delete:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Delete a campaign (marks as completed)
      tags:
      - Campaigns
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get a campaign by ID
      tags:
      - Campaigns
    put:
      consumes:
      - application/json
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_campaigns.updateCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Update a campaign
      tags:
      - Campaigns
  /campaigns/{id}/pause:
    post:
      description: Sets campaign status to paused
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Pause a campaign
      tags:
      - Campaigns
  /campaigns/{id}/resume:
    post:
      description: Sets campaign status to active
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Campaign UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_bengobox_marketflow-api_internal_httpapi.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Resume a campaign
      tags:
      - Campaigns
  /contacts:
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: 'Filter: customer, prospect, recruit, downline'
        in: query
        name: contact_type
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: List contacts
      tags:
      - Contacts
    post:
      consumes:
      - application/json
      description: Creates a contact with auto-deduplication by email/phone
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Contact data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_contacts.createContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Create a contact
      tags:
      - Contacts
  /contacts/{id}:
    delete:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Contact UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: Delete a contact
      tags:
      - Contacts
    get:
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Contact UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Get a contact by ID
      tags:
      - Contacts
    put:
      consumes:
      - application/json
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Contact UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_contacts.updateContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: Update a contact
      tags:
      - Contacts
  /f/{slug}:
    get:
      parameters:
      - description: Funnel slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: rendered HTML
          schema:
            type: string
      summary: Render public funnel as HTML
      tags:
      - Public
  /funnels:
    get:
      description: Returns paginated funnels with optional filters
      parameters:
