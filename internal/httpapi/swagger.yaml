      - description: 'Filter by status: draft, published, archived'
        in: query
        name: status
        type: string
      - description: 'Filter by type: product_inquiry, recruitment, c9_challenge,
          generic'
        in: query
        name: funnel_type
        type: string
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
