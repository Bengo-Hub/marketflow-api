<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Software | Software for Kenyan businesses</title>
<meta property="og:image" content="/images/brand/logo-share.png">
<link rel="icon" href="/favicon.ico">
</head>
<body>
<header>
  <a href="/"><img alt="Acme Software Limited" width="597" height="292" class="h-11 w-auto" src="/_next/image?url=%2Fimages%2Fbrand%2Flogo-full.png&amp;w=1200&amp;q=75"></a>
  <nav aria-label="Main">
    <a href="/services">Services</a>
    <a href="/about">About</a>
    <a href="/blog">Blog</a>
    <a href="/projects/library-system">A project</a>
    <a href="https://elsewhere.example.org/about">Someone else</a>
    <img src="/images/flags/ke.png" alt="Kenya">
  </nav>
</header>
<main>
  <section class="relative overflow-hidden pt-24">
    <h1>Software that runs your shop</h1>
    <div class="flex -space-x-2">
      <img src="https://media.example.net/auth/1111/logos/brand/aaa.jpg" alt="" class="h-8 w-8 object-contain">
      <img src="https://accounts.example.net/images/logo/urban-loft.png" alt="" class="h-8 w-8 object-contain">
    </div>
    <p>15 businesses run on Acme</p>
    <img alt="Members of the Acme team at the 2025 hackathon" class="object-cover" sizes="(min-width: 1024px) 50vw, 100vw"
      srcset="/_next/image?url=%2Fimages%2Fphotos%2Fteam-hackathon.webp&amp;w=640&amp;q=75 640w, /_next/image?url=%2Fimages%2Fphotos%2Fteam-hackathon.webp&amp;w=1920&amp;q=75 1920w"
      src="/_next/image?url=%2Fimages%2Fphotos%2Fteam-hackathon.webp&amp;w=1920&amp;q=75">
  </section>

  <section aria-labelledby="customers-heading" class="py-10 overflow-hidden">
    <p id="customers-heading">Trusted by businesses across Kenya</p>
    <div class="flex animate-marquee">
      <img src="https://media.example.net/auth/2222/logos/brand/bbb.png" alt="Small Steps Cosmetics" class="h-9 w-9 object-contain">
      <img src="https://media.example.net/auth/3333/logos/brand/ccc.jpg" alt="Gram Auto Spares" class="h-9 w-9 object-contain">
      <img src="https://cdn.example.net/clients/big-banner.jpg" alt="The Urban Loft Cafe Limited" width="1600" height="900">
    </div>
  </section>

  <section id="services" aria-labelledby="services-heading">
    <h2 id="services-heading">Built around your business</h2>
    <img alt="Mounting an ANPR camera at a weighbridge" class="object-cover"
      srcset="/images/photos/anpr-640.jpg 640w, /images/photos/anpr-1600.jpg 1600w" src="/images/photos/anpr-640.jpg">
    <img src="/images/icons/support.png" alt="" width="48" height="48">
  </section>

  <section class="cta">
    <h2>See it working in your shop</h2>
    <img alt="The inventory dashboard on a laptop in a supermarket" src="/images/photos/supermarket.jpg" width="1600" height="1067">
    <img alt="A picture of The Urban Loft" src="/images/photos/urban-loft-opening.jpg" width="1600" height="1067">
  </section>

  <section class="testimonials">
    <h2>What owners say</h2>
    <img src="/images/people/jane.jpg" alt="Jane, shop owner" width="1200" height="1200">
  </section>
</main>
<footer>
  <img src="/images/photos/office-footer.jpg" alt="Our office at night" width="1600" height="900">
</footer>
</body>
</html>
